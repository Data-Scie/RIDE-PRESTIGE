name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # prisma generate only needs this var to be present and well-formed, not reachable.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
  JWT_SECRET: "ci-placeholder-secret-not-used-at-runtime"

jobs:
  api:
    name: API (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=apps/api
      - run: npm run typecheck --workspace=apps/api
      - run: npm run build --workspace=apps/api

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      - run: npm run typecheck --workspace=apps/web
      - run: npm run build --workspace=apps/web

  mobile-lint:
    name: Mobile apps (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:mobile

  # CI-gated deploy: Render is triggered here instead of on raw git push, so a
  # failing CI run blocks production. To enable:
  #   1. In Render dashboard: Service → Settings → Build & Deploy → disable "Auto-Deploy".
  #   2. In Render dashboard: Service → Settings → Build & Deploy → copy "Deploy Hook" URL.
  #   3. In GitHub: repo Settings → Secrets → Actions → add RENDER_DEPLOY_HOOK_URL.
  #   4. In GitHub: repo Settings → Branches → add branch protection rule for "main",
  #      require status checks "API (typecheck + build)", "Web (lint + typecheck + build)",
  #      "Mobile apps (lint)", and "Deploy to Render" to pass before merging.
  deploy-render:
    name: Deploy to Render
    needs: [api, web, mobile-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
